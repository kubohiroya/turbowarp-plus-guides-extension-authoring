    - Moko.say:
        text: 呼ぶたびに回数が増えるブロックを作ったよ。誰の回数かは、ひみつ！
        seconds: 6.6
        styles:
          - lesson
    - Pura.say:
        text: そこを決めよう。拡張インスタンスのフィールドは、同じ拡張を呼ぶ複数のスクリプトで共有され得るよ。
        seconds: 9.1
        styles:
          - lesson
    - Moko.say:
        text: スプライトごとの点数のつもりでthis.countを使うと、混ざってしまうかも。
        seconds: 7.9
        styles:
          - lesson
    - Pura.say:
        text: そう。作品全体、スプライト、呼び出し一回。誰に属するデータかを先に決めよう。
        seconds: 7.5
        styles:
          - lesson
    - Moko.say:
        text: 緑の旗を押せば、JavaScriptのフィールドも必ずゼロに戻る？
        seconds: 6.7
        styles:
          - lesson
    - Pura.say:
        text: 自動でそうなると決めつけない。初期化やリセットの動作を設計し、対応する環境で確かめる必要があるよ。
        seconds: 9.3
        styles:
          - lesson
    - Moko.say:
        text: 保存して開き直したら、フィールドの値も全部残る？
        seconds: 5.3
        styles:
          - lesson
    - Pura.say:
        text: ただのJavaScriptフィールドを、作品データの保存と同じだと思わないでね。永続化は別の約束になる。
        seconds: 9.8
        styles:
          - lesson
    - Moko.say:
        text: 今回のあいさつブロックは、入力から結果を作るだけ。共有状態を持たなくて済むね。
        seconds: 7.7
        styles:
