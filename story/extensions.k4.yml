    - Moko.say:
        text: 動いた！ じゃあ、よく分からない設定も全部オンで配ろう！
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: 必要な権限と対応環境を説明してからだよ。単純な文字列処理の例では、sandboxを外す必要はない。
        seconds: 9.3
        styles:
          - lesson
    - Moko.say:
        text: sandboxなしなら、なんでも速くなるから正義？
        seconds: 5.4
        styles:
          - lesson
    - Pura.say:
        text: できることと影響範囲が広がる。必要なAPIのためかを判断し、信頼するコードだけで使おう。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: この教材のGuideや紙芝居runtimeの権限と、ぼくの練習拡張の権限も、別の話だね。
        seconds: 8.5
        styles:
          - lesson
    - Pura.say:
        text: そう。例はネット通信もファイル操作も行わない。まず「モコ」「空欄」「123」で結果を確認してみよう。
        seconds: 9.5
        styles:
          - lesson
    - Moko.say:
        text: 公開後にopcodeや引数名を変えたら、見た目が似ていても古い作品が動かなくなるかも。
        seconds: 8.3
        styles:
          - lesson
    - Pura.say:
        text: 互換性の変更を説明し、版と配布元を記録しよう。対応するエディタでの実動作も確かめるんだ。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: ソース、使い方、ライセンス、試した環境を添えれば、使う人も判断しやすいね。
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: 完成例を読んで、自分の小さな一個を考えてみよう。入力・結果・影響を説明できるブロックから始めよう！
        seconds: 9.3
