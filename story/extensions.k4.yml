        y: -110
        scale: 9.5
    - Moko.say:
        text: "[NAME]って書けば、ぼくの名前を自動で知ってくれる？"
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: そこは入力の置き場所。argumentsにNAMEの型や初期値を宣言し、実行時はargs.NAMEで受け取るよ。
        seconds: 10.4
        styles:
          - lesson
    - Moko.say:
        text: 初期値は「モコ」。そこへ「プラ」を入れれば「プラさん」が返るね。
        seconds: 6.6
        styles:
          - lesson
    - Pura.say:
        text: reporterの結果はreturnで返す。consoleへのログや、画面へセリフを出すこととは違う働きだよ。
        seconds: 10.3
        styles:
          - lesson
    - Moko.say:
        text: 入力型を文字列に指定したから、絶対に文字しか来ないよね？
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: 型の指定は入力欄の形などの目安で、実行時の値を保証しない。必要な型へ変換して扱おう。
        seconds: 8.2
        styles:
          - lesson
    - Moko.say:
        text: 今回はScratch.Cast.toStringを使う。数値が入っても、文字としてつなげられるね。
        seconds: 9.3
        styles:
          - lesson
    - Pura.say:
        text: 数値ならtoNumberなど、意図に合った変換を選ぼう。空欄や想定外の入力をどう扱うかも仕様にするんだ。
        seconds: 9.8
        styles:
          - lesson
    - Moko.say:
        text: 「モコ」、空文字、123。別々の入力で、期待した結果と比べてみよう。
        seconds: 6.9
        styles:
          - lesson
    - Pura.say:
        text: 一般の関数講座で扱った入力・結果・契約が、拡張ブロックの設計にもつながるね。
        seconds: 7.5
        styles:
          - lesson
