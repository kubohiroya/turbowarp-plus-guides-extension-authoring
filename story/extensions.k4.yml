        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: 時間のかかる処理？ 完了するまで、whileでずっと待てばいい！
        seconds: 6.6
        styles:
          - lesson
    - Pura.say:
        text: 忙しく回り続ける待ち方は、処理を占有してしまう。非同期の処理は、Promiseで完了や結果を知らせよう。
        seconds: 9.8
        styles:
          - lesson
    - Moko.say:
        text: Promiseを返すと、そのブロックを呼んだスクリプトが結果を待てるんだね。
        seconds: 7.5
        styles:
          - lesson
    - Pura.say:
        text: そう。他のスクリプトまで全部止める待ち方とは違う。サンプルには、少し待ってあいさつを返すブロックもあるよ。
        seconds: 9.9
        styles:
          - lesson
    - Moko.say:
        text: 待ち時間の入力を、とんでもなく大きくしたら？
        seconds: 4.9
        styles:
          - lesson
    - Pura.say:
        text: 扱う範囲を決めよう。今回の例は0〜2秒に収める。実際のアプリなら、要求や外部処理の性質に合わせて考える。
        seconds: 9.8
        styles:
          - lesson
    - Moko.say:
        text: 通信に失敗したら、ずっと黙って待たせるのは困るね。
        seconds: 5.4
        styles:
          - lesson
    - Pura.say:
        text: 失敗時に返す値や通知、タイムアウトなどを設計する。成功したふりをしないことが大切だよ。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: 停止ボタンを押したら、外部で始めた仕事も必ず止まる？
        seconds: 5.6
        styles:
          - lesson
    - Pura.say:
        text: Promise自体に一律の中止機能はない。止められる仕組みや後始末が必要か、利用するAPIと実行環境に合わせて設計しよう。
        seconds: 11.2
        styles:
          - lesson
