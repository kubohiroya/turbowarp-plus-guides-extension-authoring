    - Moko.say:
        text: getInfoって「情報ください！」と大声で言う関数？
        seconds: 5.8
        styles:
          - lesson
    - Pura.say:
        text: エディタへブロックの説明を渡すメソッドだよ。拡張のid、表示名、ブロック一覧などを返すんだ。
        seconds: 8.8
        styles:
          - lesson
    - Moko.say:
        text: 表示名は変えられるけど、idは作品の識別に使うんだね。
        seconds: 5.8
        styles:
          - lesson
    - Pura.say:
        text: そう。英数字の適切なidを選び、他の拡張と衝突させない。公開後に変えると既存作品との関係が変わり得るよ。
        seconds: 9.8
        styles:
          - lesson
    - Moko.say:
        text: opcodeがgreetなら、実装もgreet(args)。名前がつながっている！
        seconds: 8
        styles:
          - lesson
    - Pura.say:
        text: 見た目のtextと、内部の識別子opcodeは別。翻訳で表示文を変えても、内部の約束は保つとよいね。
        seconds: 9.5
        styles:
          - lesson
    - Moko.say:
        text: ブロックの形は全部丸にする？
        seconds: 4.5
        styles:
          - lesson
    - Pura.say:
        text: 値を返すreporter、真偽を返すboolean、動作するcommandなど、使う側が期待する役割に合わせよう。
        seconds: 10.6
        styles:
          - lesson
    - Moko.say:
        text: 最後にScratch.extensions.registerで登録すると、エディタに見つけてもらえるんだ。
        seconds: 9.9
        styles:
          - lesson
    - Pura.say:
        text: 宣言と実装が一致するか、登録が一回か、読み込みエラーがないかを、小さな状態で確認しよう。
        seconds: 8.5
        styles:
          - lesson
