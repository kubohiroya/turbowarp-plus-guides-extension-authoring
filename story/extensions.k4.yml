    - stage: Board_extensions_first
    - Unit1.hide: {}
    - Unit2.hide: {}
    - Unit3.hide: {}
    - Unit4.hide: {}
    - Unit5.hide: {}
    - Unit6.hide: {}
    - AnswerA.hide: {}
    - AnswerB.hide: {}
    - NextUnit.hide: {}
    - Menu.hide: {}
    - Pura.show:
        skin: PuraIdle
        x: -135
        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: 関数が分かったから、次はブロックを百個増やすぞ！
        seconds: 5.3
        styles:
          - lesson
    - Pura.say:
        text: まず一個から。機能拡張は、エディタに新しいブロックとその処理を提供する仕組みだよ。
        seconds: 8
        styles:
          - lesson
    - Moko.say:
        text: Scratchの「ブロック定義」を作るのと同じ？
        seconds: 5.3
        styles:
          - lesson
    - Pura.say:
        text: 作品内の手順をまとめる定義ブロックとは違う。ここではTurboWarp互換のJavaScript拡張を作るんだ。
        seconds: 10.4
        styles:
          - lesson
    - Moko.say:
        text: じゃあ標準Scratchのサイトにも、そのまま読み込める？
        seconds: 6.1
        styles:
          - lesson
    - Pura.say:
        text: 任意のJavaScript拡張を標準Scratchサイトへ読み込めるわけではないよ。Plusや対応するTurboWarp環境を使おう。
        seconds: 12.2
        styles:
          - lesson
    - Moko.say:
        text: 題材は「名前にさんをつける」丸いブロック。小さくて、結果が分かりやすいね。
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: ブロックの情報をgetInfoで宣言し、処理のメソッドを書き、インスタンスを登録する。この三つが入口だ。
        seconds: 9.8
        styles:
          - lesson
    - Moko.say:
        text: 完成例は教材のソースに入っているよ。紙芝居を動かすために、その例を読み込む必要はないんだ。
        seconds: 8.7
        styles:
          - lesson
    - Pura.say:
        text: 教材と開発例を分けてあるから、説明を読んでから、自分の練習用プロジェクトで試せるよ。
        seconds: 8.2
        styles:
          - lesson
